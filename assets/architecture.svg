<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Suricata lab architecture diagram</title>
<desc>Your PC contains the Docker Desktop VM, inside which live the attacker containers connected to interface eth0, a bridge network containing the victim container, and the Suricata engine listening on both paths. Logs feed a test script that runs on the host.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="600" fill="#FFFFFF"/>

<!-- PC outer container -->
<rect x="30" y="30" width="600" height="540" rx="24" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="50" y="58" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Your PC (Windows)</text>
<text x="50" y="76" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">host machine, PowerShell</text>

<!-- VM container -->
<rect x="70" y="105" width="540" height="355" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="133" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Docker Desktop VM</text>
<text x="90" y="151" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#185FA5">created automatically</text>

<!-- Attacker box -->
<rect x="100" y="172" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="185" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Attackers</text>
<text x="185" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#712B13">network host</text>

<!-- eth0 box -->
<rect x="300" y="172" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="375" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">eth0 interface</text>
<text x="375" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">192.168.65.x</text>

<line x1="270" y1="200" x2="298" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="200" x2="468" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Bridge container -->
<rect x="470" y="152" width="130" height="130" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="482" y="174" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">lab_net</text>
<text x="482" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">172.18.0.0/16</text>

<!-- victim box -->
<rect x="485" y="206" width="100" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="535" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#173404">victim</text>
<text x="535" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B6D11">172.18.0.2</text>

<path d="M375 228 L330 302" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M535 282 L400 302" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Suricata box -->
<rect x="250" y="302" width="200" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="350" y="326" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">Suricata engine</text>
<text x="350" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">listens on both interfaces</text>

<line x1="350" y1="362" x2="350" y2="382" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Logs box -->
<rect x="260" y="382" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="350" y="406" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Logs</text>
<text x="350" y="424" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">eve.json &amp; fast.log</text>

<path d="M350 438 L360 490" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Test script box -->
<rect x="260" y="490" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="360" y="514" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#412402">test_rules.py</text>
<text x="360" y="532" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#854F0B">runs in PowerShell</text>
</svg>
